<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUFFE — музыка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050811;
      --surface: #0f1424;
      --surface-hover: #161d33;
      --text: #eaf0ff;
      --sub: #7a89a8;
      --accent: #5ce1e6;
      --accent2: #a855f7;
      --border: #1f2942;
      --glow: rgba(92, 225, 230, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 100px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(92, 225, 230, 0.08) 0%, transparent 40%);
    }

    .snowflake {
      position: fixed; top: -10px; color: #fff; font-size: 1em; font-family: Arial;
      text-shadow: 0 0 5px rgba(255,255,255,0.5); user-select: none; pointer-events: none;
      z-index: 0; opacity: 0.6; animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

    .container { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.5rem; position: relative; z-index: 1; }

    header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; }
    .brand span { color: var(--accent); text-shadow: 0 0 10px var(--glow); }
    .sub { color: var(--sub); font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; font-family: 'JetBrains Mono', monospace; }
    
    .garland { display: flex; gap: 10px; margin-top: 10px; }
    .bulb { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 2s infinite alternate; }
    .bulb:nth-child(even) { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation-delay: 1s; }
    .bulb:nth-child(3n) { background: #fff; box-shadow: 0 0 8px #fff; animation-delay: 0.5s; }
    @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .divider { height: 1px; margin: 2rem 0; background: linear-gradient(90deg, transparent, var(--border), transparent); }

    .section-title { color: var(--sub); font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 1.2rem; font-family: 'JetBrains Mono', monospace; }

    .track {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 0.8rem;
      display: flex; align-items: center; gap: 1rem; cursor: pointer;
      transition: all 0.25s ease; user-select: none;
    }
    .track:hover { border-color: var(--accent); background: var(--surface-hover); transform: translateX(4px); }
    .track.active { border-color: var(--accent); background: linear-gradient(90deg, rgba(92, 225, 230, 0.1), var(--surface-hover)); box-shadow: 0 0 15px rgba(92, 225, 230, 0.1); }
    .track .play { width: 44px; height: 44px; min-width: 44px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .track.active .play { background: var(--accent); border-color: var(--accent); color: #000; box-shadow: 0 0 10px var(--glow); }
    .track:hover .play { border-color: var(--accent); color: var(--accent); }
    .track.active:hover .play { color: #000; }
    
    .track .info { flex: 1; min-width: 0; }
    .track .title { font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track.active .title { color: var(--accent); }
    .track .artist { color: var(--sub); font-size: 0.85rem; margin-top: 0.2rem; }
    .track .num { color: var(--sub); font-size: 0.8rem; min-width: 1.8rem; text-align: right; font-family: 'JetBrains Mono', monospace; }

    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); padding: 1rem 1.5rem;
      transform: translateY(120%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }
    .player-bar.visible { transform: translateY(0); }
    .player-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 1.2rem; }
    .pp-btn { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; background: var(--accent); color: #000; border: none; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 0 15px var(--glow); }
    .pp-btn:hover { transform: scale(1.05); background: #fff; }
    .player-info { flex: 1; min-width: 0; }
    .player-title { font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-artist { color: var(--sub); font-size: 0.8rem; margin-top: 2px; }
    .progress-wrap { margin-top: 0.6rem; height: 4px; background: var(--border); border-radius: 999px; cursor: pointer; position: relative; }
    .progress { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width 0.1s linear; }
    .time { color: var(--sub); font-size: 0.75rem; min-width: 8rem; text-align: right; font-family: 'JetBrains Mono', monospace; }

    footer { margin-top: 3rem; text-align: center; }
    footer .copyright { color: var(--sub); font-size: 0.8rem; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <div class="brand">GUFFE<span>.</span></div>
        <div class="sub">// звуковая полка</div>
      </div>
      <div class="garland">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      </div>
    </header>

    <div class="divider"></div>

    <div class="section-title">пластинки</div>
    
    <div id="list"></div>

    <footer>
      <div class="copyright">© 2026 GUFFE</div>
    </footer>
  </div>

  <div class="player-bar" id="playerBar">
    <div class="player-inner">
      <button class="pp-btn" id="ppBtn">▶</button>
      <div class="player-info">
        <div class="player-title" id="pTitle">—</div>
        <div class="player-artist" id="pArtist"></div>
        <div class="progress-wrap" id="progressWrap"><div class="progress" id="progress"></div></div>
      </div>
      <div class="time" id="pTime">0:00 / 0:00</div>
    </div>
  </div>

  <script>
    // ===== СПИСОК ТРЕКОВ =====
    const tracks = [
  // Автостопом по фазе сна
  { title: "Дискотека-90х", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/disco_90.mp3" },
  { title: "Дисоциальное растройство", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/social_disorder.mp3" },
  { title: "Идите нахуй", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/idite_nahuy.mp3" },
  { title: "Собачий вальс", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/sobachiy_vals.mp3" },
  { title: "Утиль", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/util.mp3" },
  { title: "Лайтово", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/laytovo.mp3" },
  { title: "Кругосветка в рамках черепной коробки", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/krugosvetka.mp3" },
  { title: "Спокойной ночи, Максим", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/spokoynoy_nochi.mp3" },
  { title: "Девочка", artist: "Автостопом по фазе сна", type: "file", src: "music/tracks/devochka.mp3" },

  // Солнечный Муслим
  { title: "Ррррррассстаа", artist: "Солнечный Муслим", type: "file", src: "music/tracks/rassstaaa.mp3" },

  // Bftv
  { title: "Субкультура", artist: "Bftv", type: "file", src: "music/tracks/subkultura.mp3" },
  { title: "Октябрь", artist: "Bftv", type: "file", src: "music/tracks/oktyabr.mp3" },

  // Bisexual from the village
  { title: "Субкультура 2", artist: "Bisexual from the village", type: "file", src: "music/tracks/subkultura_2.mp3" },

  // Кишлак
  { title: "Самый лучший день", artist: "Кишлак", type: "file", src: "music/tracks/luchshiy_den.mp3" },
  { title: "Эй", artist: "Кишлак", type: "file", src: "music/tracks/ey.mp3" },
  { title: "СХИК 2", artist: "Кишлак", type: "file", src: "music/tracks/shik_2.mp3" },
  { title: "Спили мои рога", artist: "Кишлак", type: "file", src: "music/tracks/spili_roga.mp3" },
  { title: "Я уёбываю в джаз", artist: "Кишлак", type: "file", src: "music/tracks/uebyvayu_v_djaz.mp3" },
  { title: "Похоть", artist: "Кишлак", type: "file", src: "music/tracks/pohot.mp3" },
  { title: "Лень", artist: "Кишлак", type: "file", src: "music/tracks/len.mp3" }
];


    // ===== ГЕНЕРАТОР СНЕГА =====
    function createSnow() {
      const snowflake = document.createElement('div');
      snowflake.innerHTML = '❅';
      snowflake.classList.add('snowflake');
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.animationDuration = Math.random() * 3 + 4 + 's';
      snowflake.style.opacity = Math.random() * 0.5 + 0.2;
      snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
      document.body.appendChild(snowflake);
      setTimeout(() => { snowflake.remove(); }, 7000);
    }
    setInterval(createSnow, 200);

    // ===== ЛОГИКА ПЛЕЕРА =====
    const list = document.getElementById('list');
    const bar = document.getElementById('playerBar');
    const ppBtn = document.getElementById('ppBtn');
    const pTitle = document.getElementById('pTitle');
    const pArtist = document.getElementById('pArtist');
    const progress = document.getElementById('progress');
    const progressWrap = document.getElementById('progressWrap');
    const pTime = document.getElementById('pTime');
    const audio = new Audio();

    let current = -1;
    let playing = false;

    function fmt(s) {
      if (!isFinite(s)) s = 0;
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ':' + String(r).padStart(2, '0');
    }

    function renderList() {
      list.innerHTML = '';
      tracks.forEach((t, i) => {
        const el = document.createElement('div');
        el.className = 'track';
        el.dataset.i = i;
        el.innerHTML =
          '<div class="play"><span class="ico">▶</span></div>' +
          '<div class="info"><div class="title">' + t.title + '</div>' +
          '<div class="artist">' + t.artist + '</div></div>' +
          '<div class="num">' + String(i + 1).padStart(2, '0') + '</div>';
        list.appendChild(el);
      });
    }

    list.addEventListener('click', (e) => {
      const el = e.target.closest('.track');
      if (el) play(+el.dataset.i);
    });

    function highlight() {
      document.querySelectorAll('.track').forEach((el, i) => {
        el.classList.toggle('active', i === current);
        const ico = el.querySelector('.ico');
        if (ico) ico.textContent = (i === current && playing) ? '❚❚' : '▶';
      });
    }

    function play(i) {
      if (current === i) {
        if (playing) audio.pause(); else audio.play();
        return;
      }
      audio.pause();
      current = i;
      const t = tracks[i];
      pTitle.textContent = t.title;
      pArtist.textContent = t.artist;
      bar.classList.add('visible');

      audio.src = t.src;
      audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
      
      highlight();
    }

    function setPlaying(v) {
      playing = v;
      ppBtn.textContent = v ? '❚❚' : '▶';
      highlight();
    }

    ppBtn.addEventListener('click', () => {
      if (current === -1) return;
      if (playing) audio.pause(); else audio.play();
    });

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
        pTime.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
      }
    });
    audio.addEventListener('ended', () => {
      if (current + 1 < tracks.length) play(current + 1);
      else { setPlaying(false); progress.style.width = '0%'; }
    });

    progressWrap.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const r = progressWrap.getBoundingClientRect();
      audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
    });

    renderList();
  </script>
</body>
</html>
